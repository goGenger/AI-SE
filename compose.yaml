name: ai-se

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aise}
      POSTGRES_DB: ${POSTGRES_DB:-aise}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Loopback-only, for the host-run dev server (`pnpm dev`).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_se_network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Loopback-only, for the host-run dev server (`pnpm dev`).
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_se_network

  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: >
      sh -c "pnpm --filter @ai-se/database migrate &&
      pnpm --filter @ai-se/server start"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-aise}@postgres:5432/${POSTGRES_DB:-aise}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      AGENT_WORKSPACE_ROOT: ${AGENT_WORKSPACE_ROOT:-/app}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      CI_PROVIDER: ${CI_PROVIDER:-local}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      DELIVERY_DOCKER_COMMAND: ${DELIVERY_DOCKER_COMMAND:-docker}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3000:3000"
    networks:
      - ai_se_network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: pnpm --filter @ai-se/web dev --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5173', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5173:5173"
    networks:
      - ai_se_network

  # `docs/236` §3：出口收敛。沙箱装依赖的唯一出口。
  #
  # 同时接两个网络：`ai_se_network` 让它自己出网（拉 npmjs），`ai_se_egress`
  # （`--internal`，无默认路由）让沙箱能访问它。**沙箱只接后者**，所以生成物
  # 打不到任何外部地址，也无法解析外部域名。
  #
  # 沙箱侧用 `network: "registry"`；默认仍是 `none`（见 `SandboxLimits`）。
  registry:
    image: verdaccio/verdaccio:6
    # 容器名钉住：沙箱在同网络里按这个名字找它（`DEFAULT_EGRESS.registry`）。
    container_name: ai-se-registry
    environment:
      VERDACCIO_PORT: 4873
    volumes:
      - registry_config:/verdaccio/conf
      - registry_storage:/verdaccio/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4873/-/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_se_network
      - ai_se_egress

volumes:
  postgres_data:
  redis_data:
  registry_config:
  registry_storage:

networks:
  ai_se_network:
    driver: bridge
  # `--internal`：Docker 不为该网络配置默认路由。这是「打不到互联网」的**拓扑**保证，
  # 不是靠环境变量或防火墙约定（`docs/236` §3）。
  #
  # 名字用 `name:` 显式钉住：compose 默认会加 `ai-se_` 前缀，而 `DEFAULT_EGRESS`
  # （`packages/sandbox/src/index.ts`）和沙箱的 `--network` 参数用的是这个名字。
  ai_se_egress:
    name: ai-se-egress
    driver: bridge
    internal: true
